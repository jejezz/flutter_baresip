name: flutter_baresip
description: "baresip SIP stack for Flutter desktop (macOS, Windows) via dart:ffi and native assets."
version: 0.1.1
publish_to: 'none'

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^2.1.0
  crypto: ^3.0.6
  ffi: ^2.1.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

# SIP 스택은 dart:ffi(hook/build.dart)로 싣는다. macOS 플러그인은 영상 텍스처를
# 등록하는 일만 한다(macos/flutter_baresip).
flutter:
  plugin:
    platforms:
      macos:
        pluginClass: FlutterBaresipPlugin
