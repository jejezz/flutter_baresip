# baresip 스택(flutter_baresip)의 Windows 정적 라이브러리를
# native/windows 에 만든다. 라이브러리가 커서(약 95MB)
# 저장소에 넣지 않고 쓸 때마다 만든다.
#
# 빌드 스크립트·패치가 그대로면 지난 결과를 캐시에서 되살려 바로 끝난다.
# 새로 만들어야 할 때도 의존 라이브러리(OpenSSL 은 7분쯤 걸린다)는 버전별
# 캐시에서 되살린다.
name: baresip Windows libs
description: native/windows 를 만든다(캐시).

runs:
  using: composite
  steps:
    - id: out
      uses: actions/cache/restore@v4
      with:
        path: native/windows
        key: baresip-windows-out-${{ hashFiles('native/build-windows.sh', 'native/patches/**') }}

    - if: steps.out.outputs.cache-hit != 'true'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - if: steps.out.outputs.cache-hit != 'true'
      shell: bash
      run: pip install meson ninja

    # build-windows.sh 의 의존 라이브러리 버전을 바꾸면 키도 바꾼다.
    # (경로는 env 로 빼지 않는다 — 여러 줄 값이 환경에 들어가면 OpenSSL 의
    #  nmake 가 "out of environment space" 로 멈춘다.)
    - if: steps.out.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          native/third_party-windows/openssl-prefix
          native/third_party-windows/opus-prefix
          native/third_party-windows/aec-prefix
        key: baresip-windows-deps-openssl3.5.8-opus1.6.1-wap1.3
        restore-keys: baresip-windows-deps-openssl3.5.8-opus1.6.1-wap1.3-

    - if: steps.out.outputs.cache-hit != 'true'
      shell: bash
      working-directory: native
      run: ./build-windows.sh

    # 뒤 단계가 실패해도 다음 실행이 다시 쓰도록 저장한다.
    - if: always() && steps.out.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          native/third_party-windows/openssl-prefix
          native/third_party-windows/opus-prefix
          native/third_party-windows/aec-prefix
        key: baresip-windows-deps-openssl3.5.8-opus1.6.1-wap1.3-${{ github.run_id }}

    - if: steps.out.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: native/windows
        key: ${{ steps.out.outputs.cache-primary-key }}
